plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def gomokuLocalProperties = new Properties()
def gomokuLocalPropertiesFile = rootProject.file('local.properties')
if (gomokuLocalPropertiesFile.exists()) gomokuLocalPropertiesFile.withInputStream { gomokuLocalProperties.load(it) }
android { namespace 'ai.mlc.gomoku'; compileSdk 35
    defaultConfig { applicationId 'ai.mlc.gomoku'; minSdk 26; targetSdk 33; versionCode 1; versionName '1.0' }
    buildTypes {
        debug { buildConfigField 'String', 'ARK_API_KEY', '"' + (gomokuLocalProperties.getProperty('ARK_API_KEY', '').replace('"', '\\"')) + '"' }
        release { buildConfigField 'String', 'ARK_API_KEY', '""' }
    }
    buildFeatures { compose true; buildConfig true }; composeOptions { kotlinCompilerExtensionVersion '1.4.3' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
android.defaultConfig {
    // Release APKs always override this to empty; use a server-issued token in production.
    buildConfigField 'String', 'ARK_API_KEY', '""'
    buildConfigField 'String', 'ARK_MODEL', '"deepseek-v4-flash-ga-260731"'
    buildConfigField 'String', 'ARK_ENDPOINT', '"https://ark.cn-beijing.volces.com/api/v3/chat/completions"'
}
dependencies {
    implementation project(':local-llm-sdk'); implementation project(':mlc4j')
    implementation 'androidx.activity:activity-compose:1.7.1'
    implementation platform('androidx.compose:compose-bom:2022.10.00')
    implementation 'androidx.compose.ui:ui'; implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3:1.1.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
}
